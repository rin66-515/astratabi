server:
  port: ${PORTAL_BACKEND_PORT:18082}

spring:
  application:
    name: astratabi-delivery-backend
  servlet:
    multipart:
      max-file-size: 210MB
      max-request-size: 211MB
  datasource:
    url: ${PORTAL_DB_URL:jdbc:postgresql://127.0.0.1:15432/astratabi}
    username: ${PORTAL_DB_USERNAME:astratabi}
    password: ${PORTAL_DB_PASSWORD:astratabi_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

portal:
  public-base-url: ${PORTAL_PUBLIC_BASE_URL:http://127.0.0.1:18100}
  bootstrap:
    admin-login-id: ${PORTAL_BOOTSTRAP_ADMIN_LOGIN_ID:admin-001}
    admin-password: ${PORTAL_BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    token-pepper: ${PORTAL_TOKEN_PEPPER:}
    cookie-secure: ${PORTAL_COOKIE_SECURE:true}
    admin-lock-minutes: 15
    max-failed-logins: 5
  package-storage:
    root: ${PORTAL_PACKAGE_STORAGE_ROOT:.portal-data}
    allowed-base-name: ${PORTAL_PACKAGE_BASE_NAME:ASRAY_COMPLETE,ASRAY_DOCS_COMPLETE,ASRAY_DESIGN_EXAMPLES,ASRAY_REQUIREMENTS_COMMUNICATION,ASRAY_INCIDENT_BUG_REPORT,ASRAY_TEST_SPEC_EVIDENCE,ASRAY_PM_RELEASE_OPERATIONS}
    max-upload-bytes: ${PORTAL_PACKAGE_MAX_UPLOAD_BYTES:209715200}
    max-entry-count: 10000
    max-uncompressed-bytes: 1073741824
  asray:
    enabled: ${PORTAL_ASRAY_ENABLED:false}
    base-url: ${PORTAL_ASRAY_BASE_URL:http://asray-api:8080}
    client-id: ${PORTAL_ASRAY_CLIENT_ID:astratabi-local}
    hmac-secret: ${PORTAL_ASRAY_HMAC_SECRET:local-only-hmac-secret-change-before-production}
    activation-url-encryption-key: ${PORTAL_ASRAY_ACTIVATION_URL_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
