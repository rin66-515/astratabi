services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:18100:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORTAL_BACKEND_PORT: "18082"
      PORTAL_DB_URL: jdbc:postgresql://postgres:5432/astratabi
      PORTAL_DB_USERNAME: astratabi
      PORTAL_DB_PASSWORD: astratabi_local_only
      PORTAL_PUBLIC_BASE_URL: http://127.0.0.1:18100
      PORTAL_BOOTSTRAP_ADMIN_LOGIN_ID: ${PORTAL_BOOTSTRAP_ADMIN_LOGIN_ID:-admin-001}
      PORTAL_BOOTSTRAP_ADMIN_PASSWORD: ${PORTAL_BOOTSTRAP_ADMIN_PASSWORD:-astratabi-local-admin}
      PORTAL_TOKEN_PEPPER: ${PORTAL_TOKEN_PEPPER:-astratabi-local-only-token-pepper-change-before-production}
      PORTAL_DELIVERY_TOKEN_ENCRYPTION_KEY: ${PORTAL_DELIVERY_TOKEN_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      PORTAL_COOKIE_SECURE: "false"
      PORTAL_PACKAGE_STORAGE_ROOT: /var/lib/astratabi/packages
      PORTAL_ASRAY_ENABLED: "true"
      PORTAL_ASRAY_BASE_URL: http://asray-api:8080
      PORTAL_ASRAY_CLIENT_ID: ${PORTAL_ASRAY_CLIENT_ID:-astratabi-local}
      PORTAL_ASRAY_HMAC_SECRET: ${PORTAL_ASRAY_HMAC_SECRET:-local-only-hmac-secret-change-before-production}
      PORTAL_ASRAY_ACTIVATION_URL_KEY: ${PORTAL_ASRAY_ACTIVATION_URL_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    ports:
      - "127.0.0.1:18082:18082"
    volumes:
      - astratabi-package-data:/var/lib/astratabi/packages
    restart: unless-stopped
    networks:
      - default
      - dev-lab-proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:18082/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: astratabi
      POSTGRES_USER: astratabi
      POSTGRES_PASSWORD: astratabi_local_only
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astratabi -d astratabi"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - astratabi-postgres-data:/var/lib/postgresql

volumes:
  astratabi-postgres-data:
  astratabi-package-data:

networks:
  dev-lab-proxy:
    external: true
    name: dev-lab-proxy
